<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Event</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        width: 400px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        animation: fadeIn 1s ease;
    }

    h2 {
        margin-bottom: 20px;
        color: #333;
    }

    input {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 14px;
    }

    button {
        width: 95%;
        padding: 12px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        transition: 0.3s;
        cursor: pointer;
    }

    button:hover {
        background: #5a67d8;
        transform: scale(1.05);
    }

    a {
        display: block;
        margin-top: 12px;
        text-decoration: none;
        color: #555;
    }

    a:hover {
        text-decoration: underline;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }
</style>
</head>

<body>

<div class="container">
    <h2>➕ Add Event</h2>

    <form method="POST">
        <input type="text" name="name" placeholder="Event Name" required>

        <input type="text" name="image" placeholder="Image name (example: wedding.jpg)" required>

        <button type="submit">Add Event</button>
    </form>

    <a href="/admin_dashboard">⬅ Back to Dashboard</a>
</div>

</body>
</html>
