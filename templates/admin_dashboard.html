<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #1d2671, #c33764);
        color: white;
    }

    nav {
        display: flex;
        justify-content: space-between;
        padding: 15px 30px;
        background: rgba(0,0,0,0.3);
    }

    nav a {
        color: white;
        text-decoration: none;
        margin-left: 15px;
    }

    .container {
        padding: 30px;
    }
    h4{
        text-align: center;
        margin:40px auto;
        font-size:2rem;
        font-weight:600;
        color:white;
        text-shadow:0 0 25px white;
    }


    .add-btn {
        display: block;
        width: 200px;
        margin: 20px auto;
        padding: 10px;
        background: #00c6ff;
        text-align: center;
        border-radius: 5px;
        text-decoration: none;
        color: white;
        transition: 0.3s;
    }

    .add-btn:hover {
        background: #0072ff;
        transform: scale(1.05);
    }

    .cards {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
    }

    .card {
        background: white;
        color: black;
        width: 250px;
        margin: 15px;
        border-radius: 10px;
        overflow: hidden;
        transition: 0.3s;
        animation: fadeIn 1s ease;
    }

    .card:hover {
        transform: translateY(-10px);
    }

    .card img {
        width: 100%;
        height: 150px;
        object-fit: cover;
    }

    .card h3 {
        padding: 10px;
    }

    .actions {
        text-align: center;
        padding-bottom: 10px;
    }

    .btn {
        padding: 6px 12px;
        margin: 5px;
        border-radius: 5px;
        text-decoration: none;
        color: white;
        font-size: 14px;
    }

    .edit {
        background: #28a745;
    }

    .delete {
        background: #dc3545;
    }

    .bookings {
        background: rgba(255,255,255,0.1);
        padding: 20px;
        margin-top: 30px;
        border-radius: 10px;
    }

    .booking-item {
        margin: 10px 0;
        padding: 10px;
        background: rgba(0,0,0,0.2);
        border-radius: 5px;
    }

    .flash {
        background: orange;
        padding: 10px;
        text-align: center;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <h4 class="hbtn">Admin Dashboard</h4>
    <div>
        <a href="/logout">Logout</a>
    </div>
</nav>

<div class="container">



    <!-- FLASH -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash">
                {% for msg in messages %}
                    {{ msg }}
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <!-- ADD EVENT -->
    <!--<a href="view.html"> VIEW</a>-->

    <a href="/view" class="add-btn">VIEW BOOKINGS</a>
    <a href="/add_event" class="add-btn">MANAGE EVENT</a>

    <!-- EVENTS -->
    <div class="cards">
        {% for event in events %}
        <div class="card">
            <img src="{{ url_for('static', filename='images/' + event[2]) }}" alt="event">
            <h3>{{ event[1] }}</h3>

            <div class="actions">
                <a href="/edit_event/{{ event[0] }}" class="btn edit">Edit</a>
                <a href="/delete_event/{{ event[0] }}" class="btn delete">Delete</a>
                <a href="/view_bookings" class="btn">View Bookings</a>
            </div>
        </div>
        {% endfor %}
    </div>
