<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Event</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .box {
        background: white;
        padding: 30px;
        border-radius: 10px;
        width: 350px;
        text-align: center;
        animation: fadeIn 1s ease;
    }

    h2 {
        margin-bottom: 20px;
    }

    input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
        border: 1px solid #ccc;
    }

    button {
        width: 95%;
        padding: 10px;
        background: #ff758c;
        color: white;
        border: none;
        border-radius: 5px;
        transition: 0.3s;
    }

    button:hover {
        background: #e84363;
        transform: scale(1.05);
    }

    a {
        display: block;
        margin-top: 10px;
        text-decoration: none;
        color: black;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }
</style>
</head>

<body>

<div class="box">
    <h2>Edit Event</h2>

    <form method="POST">
        <!-- Event Name -->
        <input type="text" name="name" value="{{ event[1] }}" required>

        <!-- Image Name -->
        <input type="text" name="image" value="{{ event[2] }}" required>

        <button type="submit">Update Event</button>
    </form>

    <a href="/admin_dashboard"> Back</a>
</div>

</body>
</html>
