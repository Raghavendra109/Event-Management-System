<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Event Manager</title>

    <style>
      /* Reuse the core variables from your landing page */
:root {
    --primary-blue: #1e3a8a;
    --accent-gold: #fbbf24;
    --bg-dark: #0f172a;
    --text-muted: #94a3b8;
    --glass-bg: rgba(255, 255, 255, 0.95); /* Bright clean card */
    --transition: all 0.3s ease;
}

body {
    background-image: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

/* 1. THE LOGIN CONTAINER (CARD) */
.container {
    background: var(--glass-bg);
    padding: 3rem;
    border-radius: 20px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    width: 100%;
    max-width: 400px;
    text-align: center;
    animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

.container h2 {
    color: #1e293b;
    margin-bottom: 2rem;
    font-size: 1.8rem;
    font-weight: 700;
}

/* 2. FLASH MESSAGES (Errors/Success) */
.flash {
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    text-align:center;
    font-weight:bold;
    color:white;
    }
    .success{
        background-color:#28a745;
    }
    .error{
           background-color:#dc3545;
    }


/* 3. FORM INPUTS & SELECT */
form {
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
}

select, input {
    width: 100%;
    padding: 0.8rem 1rem;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 1rem;
    transition: var(--transition);
    background-color: #f8fafc;
}

select:focus, input:focus {
    outline: none;
    border-color: var(--primary-blue);
    box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
    background-color: #fff;
}

/* 4. SUBMIT BUTTON */
button[type="submit"] {
    background: linear-gradient(to right, #3b82f6, #1e3a8a);
    color: white;
    padding: 0.9rem;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 1rem;
    transition: var(--transition);
    margin-top: 0.5rem;
}

button[type="submit"]:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 15px -3px rgba(30, 58, 138, 0.3);
    filter: brightness(1.1);
}

/* 5. LINKS (Register & Back Home) */
a {
    display: block;
    margin-top: 1.2rem;
    color: #64748b;
    text-decoration: none;
    font-size: 0.9rem;
    transition: var(--transition);
}

a:hover {
    color: var(--primary-blue);
}

/* Entrance Animation */
@keyframes fadeInScale {
    from {
        opacity: 0;
        transform: scale(0.95) translateY(10px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}
    </style>
</head>

<body>

<div class="container">
    <h2> Login</h2>

    <!-- FLASH MESSAGE -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {%  for category, message in messages %}
            <div class="flash {{ category }}">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
    {% endwith %}


    <form method="POST">

        <!-- ROLE SELECT -->
        <select name="role" required>
            <option value="">Select Role</option>
            <option value="user">User Login</option>
            <option value="admin">Admin Login</option>
        </select>

        <!-- USERNAME -->
        <input type="email" name="email" placeholder="Enter  your Email" required>

        <!-- PASSWORD -->
        <input type="password" name="password" placeholder="Enter Password" required>

        <!-- BUTTON -->
        <button type="submit">Login</button>
    </form>

    <a href="/register">Don't have an account? Register</a>
    <a href="/">⬅ Back to Home</a>
</div>

</body>
</html>
