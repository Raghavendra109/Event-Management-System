<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
      /* Container for the table section */
.div-class {
    max-width: 1200px;
    margin: 50px auto;
    padding: 20px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

h2 {
    font-family: 'Inter', sans-serif;
    color: #1e293b;
    margin-bottom: 25px;
    font-weight: 700;
}

/* Table Styling */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-family: 'Inter', sans-serif;
    animation: fadeIn 0.8s ease-in-out;
}

thead {
    background-color: #f8fafc;
}

th {
    text-align: left;
    padding: 15px;
    color: #64748b;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 2px solid #e2e8f0;
}

td {
    padding: 15px;
    color: #334155;
    border-bottom: 1px solid #f1f5f9;
    font-size: 0.95rem;
}

/* Row Hover Effect */
tbody tr {
    transition: background-color 0.2s ease;
}

tbody tr:hover {
    background-color: #f1f5f9;
}

/* Styling for the bold labels inside <td> */
td b {
    color: #1e3a8a;
    font-weight: 600;
}

/* Button Styling */
.btn {
    display: inline-block;
    margin-top: 30px;
    padding: 12px 24px;
    background: #1e3a8a;
    color: white !important;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
    transition: all 0.3s ease;
}

.btn:hover {
    background: #3b82f6;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}

/* Fade-in Animation */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
        }
        /* 1. Global Page Background */
body {
    /* Using the background image you referenced */
    background: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)),
                url('17777890712775556673340135851128_5bce62.jpg');
    background-size: cover;
    background-attachment: fixed;
    color: #f8fafc;
    font-family: 'Inter', sans-serif;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

/* 2. Advanced H2 Background and Animation */
h2 {
    font-size: 2.5rem;
    margin-top: 50px;
    margin-bottom: 30px;
    text-align: center;

    /* Gradient Background for the Text */
    background: linear-gradient(90deg, #22d3ee, #e879f9, #22d3ee);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;

    /* Reveal and Shine Animation */
    animation: shineText 3s linear infinite, fadeInUp 1s ease-out forwards;
}

/* --- KEYFRAMES --- */

/* Text Shine Effect */
@keyframes shineText {
    to { background-position: 200% center; }
}

/* Smooth Entrance Effect */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
        /* 1. Page Background */
body {
    /* Solid color or subtle gradient */
    background-color: #0f172a;
    background-image: radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.5) 0, transparent 50%),
                      radial-gradient(at 50% 0%, rgba(15, 23, 42, 1) 0, transparent 50%);
    color: #f8fafc;
    margin: 0;
    padding: 20px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* 2. H2 Header Color */
h2 {
    color: #22d3ee; /* Cyan color for the title */
    text-align: center;
    margin-bottom: 30px;
}

/* 3. Modern Table Colors */
table {
    width: 100%;
    border-collapse: collapse;
    background-color: #ffffff; /* White background for the table area */
    border-radius: 12px;
    overflow: hidden; /* Keeps corners rounded */
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

/* Header Row Colors */
thead {
    background-color: #1e3a8a; /* Navy Blue header */
    color: #ffffff;
}

th {
    padding: 15px;
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 1px;
    border-bottom: 2px solid #22d3ee; /* Cyan accent line */
}

/* Data Row Colors */
td {
    padding: 12px 15px;
    color: #1e293b; /* Dark text for readability on white */
    border-bottom: 1px solid #e2e8f0;
}

/* Zebra Striping (Optional: alternating row colors) */
tbody tr:nth-child(even) {
    background-color: #f8fafc;
}

/* Hover effect to highlight the row you are looking at */
    tbody tr:hover {
    background-color: #e0f2fe;
}
    </style>
</head>
<body>
 <div class="bookings">
        <h2> Booking Notifications</h2>

        {% if bookings %}
         <table border="2" style="width:100%; border-collapse:collapse; text-align:left;">
             <thead>
                <tr>
                    <th>USER</th>
                    <th>Mobile No</th>
                    <th>Event</th>
                    <th>Venue</th>
                    <th>Capacity</th>
                    <th>Date</th>
                    <th>Services</th>

                   <!-- <th>item/services</th>
                    <th>details</th>-->
                </tr>
             </thead>
             <tbody>
            {% for b in bookings %}
            <tr>
                <!--<div class="booking-item">-->
                <td><b>{{ b[0] }}</b>&nbsp&nbsp</td>
                <td><b>{{ b[2] }}</b>&nbsp</td>
                <td><b>{{b[3]}}</b>&nbsp</td>
                <td><b>{{ b[5] }}</b>&nbsp</td>
                <td><b>{{ b[6] }}</b>&nbsp</td>
                <td><b>{{ b[4] }}</b>&nbsp</td>
                <td><b>{{ b[7] }}</b></td>
            </tr>
                <!--</div>-->
            {% endfor %}
             </tbody>
         </table>
        {% else %}
            <p>No Bookings yet</p>
        {% endif %}
    </div>
 <a href="/admin_dashboard" class="btn">Logout to admin dashboard</a>
</body>
</html>
